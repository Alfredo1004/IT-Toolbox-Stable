<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte IT | Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f9; }
        .hero-banner { background: linear-gradient(135deg, #0d6efd 0%, #003d99 100%); color: white; padding: 40px 0; border-radius: 0 0 25px 25px; }
        .card-main { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .status-badge { background: white; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; border: 1px solid #eee; }
        .online-dot { height: 10px; width: 10px; background: #2ecc71; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="hero-banner text-center mb-5">
        <h1 class="fw-bold"><i class="fas fa-headset me-2"></i> Centro de Soporte IT</h1>
        <p>¿Cómo podemos ayudarte hoy?</p>
    </div>

    <div class="container mt-n5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="d-flex justify-content-center gap-3 mb-4">
                    <div class="status-badge"><span class="online-dot"></span> Internet</div>
                    <div class="status-badge"><span class="online-dot"></span> Office 365</div>
                    <div class="status-badge"><span class="online-dot"></span> Red Local</div>
                </div>

                <div class="alert alert-primary d-flex align-items-center justify-content-between p-4 mb-4 border-0 shadow-sm" style="border-radius: 15px;">
                    <div>
                        <h6 class="fw-bold mb-1">Asistente de Diagnóstico</h6>
                        <p class="small mb-0">Para reportes detallados de RAM y Disco.</p>
                    </div>
                    <a href="/static/descargas/agente_it.exe" class="btn btn-primary rounded-pill px-4 shadow-sm" download>Bajar .exe</a>
                </div>

                <div class="card card-main p-4">
                    <form id="formTicket">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej. Alfredo Valadez" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">¿Qué sucede?</label>
                            <textarea name="problema" class="form-control" rows="4" placeholder="Describe brevemente el error (ej. Mi Outlook no abre)..." required></textarea>
                        </div>
                        <input type="hidden" name="detalles_sistema" id="detalles_sistema">
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-3">Enviar Reporte</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        window.onload = async function() {
            let info = { plataforma: navigator.platform, resolucion: screen.width+"x"+screen.height, agente: "Web" };
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                info.ip_publica = data.ip;
            } catch { info.ip_publica = "Local"; }
            document.getElementById('detalles_sistema').value = JSON.stringify(info);
        };

        document.getElementById('formTicket').onsubmit = async function(e) {
            e.preventDefault();
            const res = await fetch('/enviar_ticket', { method: 'POST', body: new FormData(this) });
            if (res.ok) {
                Swal.fire({ title: '¡Enviado!', text: 'Reporte recibido correctamente.', icon: 'success' })
                .then(() => location.reload());
            }
        };
    </script>
</body>
</html>
