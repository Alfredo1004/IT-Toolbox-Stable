<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso | IT Toolbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .login-card { width: 380px; border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .login-header { background: #0f172a; color: white; padding: 40px; text-align: center; border-radius: 20px 20px 0 0; }
        .btn-primary { background: #2563eb; border: none; border-radius: 12px; padding: 12px; font-weight: 600; }
        /* Cambia el color del subtítulo en el encabezado oscuro */
.login-header p {
    color: #cbd5e1 !important; /* Un gris muy claro/azulado */
    opacity: 1 !important;
}

/* Mejora el contraste de los labels (Usuario / Contraseña) */
.form-label {
    color: #334155; /* Un gris pizarra oscuro para el fondo blanco */
}
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <i class="fas fa-toolbox fa-3x mb-3 text-primary"></i>
            <h3 class="fw-bold">IT Toolbox</h3>
            <p class="small text-muted mb-0">Portal de Soporte Técnico</p>
        </div>
        <div class="card-body p-4">
            {% if error %}<div class="alert alert-danger py-2 small text-center">{{ error }}</div>{% endif %}
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">USUARIO</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">CONTRASEÑA</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
